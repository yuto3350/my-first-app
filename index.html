<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>筋トレ記録アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header><p class="eyebrow">MY TRAINING LOG</p><h1>筋トレ記録アプリ</h1><p>今日の積み重ねを、明日の力に。</p></header>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">トレーニングを記録</h2>
      <form id="record-form">
        <div class="fields">
          <label>部位<select id="body-part" required><option value="">部位を選択してください</option><option>胸</option><option>背中</option><option>脚</option><option>腕</option><option>その他</option></select></label>
          <label>種目<select id="exercise" required disabled><option value="">先に部位を選択してください</option></select></label>
          <label>日付<input id="date" type="date" required></label>
        </div>
        <fieldset class="set-editor"><legend>セットごとの記録</legend><p class="set-help">セットごとに重量・回数を入力してください。自重は 0 kg</p><div id="set-rows"></div><button id="add-set" class="secondary" type="button">セットを追加</button></fieldset>
        <div class="form-actions"><button id="save-button" type="submit">記録を保存</button><button id="cancel-button" class="secondary" type="button" hidden>編集をキャンセル</button></div>
      </form>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <section aria-labelledby="history-title"><div class="history-heading"><h2 id="history-title">これまでの記録</h2><span id="count">0 件</span></div><label class="history-filter">部位別に見る<select id="history-part"><option value="">すべて</option><option>胸</option><option>背中</option><option>脚</option><option>腕</option><option>その他</option></select></label><p id="empty" class="empty">まだ記録がありません。<br>最初のトレーニングを記録してみましょう。</p><div id="records" class="records"></div></section>
    <footer>記録はこのブラウザに保存されます。</footer>
  </main>
</body>
</html>
