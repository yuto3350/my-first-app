<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>筋トレ記録アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header><p class="eyebrow">MY TRAINING LOG</p><h1>筋トレ記録アプリ</h1><p>今日の積み重ねを、明日の力に。</p></header>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">トレーニングを記録</h2>
      <form id="record-form">
        <div class="fields">
          <label class="wide">種目<select id="exercise" required><option value="">種目を選択してください</option><option>ベンチプレス</option><option>スクワット</option><option>デッドリフト</option><option>ショルダープレス</option><option>ラットプルダウン</option><option>ダンベルカール</option><option>腕立て伏せ</option><option>腹筋</option><option>その他</option></select></label>
          <label>重量（kg）<input id="weight" type="number" min="0" max="10000" step="0.1" placeholder="例：40" required><small>自重トレーニングは 0 kg</small></label>
          <label>回数<input id="reps" type="number" min="1" max="10000" step="1" placeholder="例：10" required></label>
          <label>セット数<input id="sets" type="number" min="1" max="1000" step="1" placeholder="例：3" required></label>
          <label>日付<input id="date" type="date" required></label>
        </div>
        <div class="form-actions"><button id="save-button" type="submit">記録を保存</button><button id="cancel-button" class="secondary" type="button" hidden>編集をキャンセル</button></div>
      </form>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <section aria-labelledby="history-title"><div class="history-heading"><h2 id="history-title">これまでの記録</h2><span id="count">0 件</span></div><p id="empty" class="empty">まだ記録がありません。<br>最初のトレーニングを記録してみましょう。</p><div id="records" class="records"></div></section>
    <footer>記録はこのブラウザに保存されます。</footer>
  </main>
</body>
</html>
